<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码审查智能体</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f6f7f9;
    --card: #ffffff;
    --accent: #2563eb;
    --assertion: #16a34a;
    --question: #b45309;
    --must: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 20px 60px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.6;
  }
  main { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], select, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 9px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: #fff;
  }
  textarea { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; height: 210px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > * { flex: 1 1 180px; }
  .row > .tight { flex: 0 0 auto; }
  button {
    border: 0;
    border-radius: 7px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: inherit;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.ghost { background: #eef1f5; color: var(--ink); }
  button:disabled { opacity: .55; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .commits { max-height: 300px; overflow: auto; margin: 0 -6px; }
  .commit {
    display: flex; gap: 8px; align-items: center;
    padding: 6px; border-radius: 7px;
  }
  .commit:hover { background: #f3f5f8; }
  .commit.base { background: #eef4ff; }
  .commit.head { background: #eefaf1; }
  .commit .id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); width: 62px; flex: 0 0 62px; }
  .commit .msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .pick { font-size: 11px; padding: 3px 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(3, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .num { font-size: 22px; font-weight: 600; }
  .card .cap { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
  .tier { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: #fdecec; color: var(--must); }
  .tier.JUDGE { background: #fdf3e3; color: var(--question); }
  .tier.SKIP { background: #f0f1f3; color: var(--muted); }
  .comment { border-left: 3px solid var(--accent); background: var(--card); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .comment .where { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .comment .body { white-space: pre-wrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-left: 8px; }
  .tag.ASSERTION { background: #e9f7ee; color: var(--assertion); }
  .tag.QUESTION { background: #fdf3e3; color: var(--question); }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .note { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .error { color: #b91c1c; font-size: 13px; }
  code.path { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>代码审查智能体</h1>
  <p class="lead">挑两个提交，看它把哪些改动判为必查、取证到了什么、最后为什么只留这几条评论。也可以直接改一段代码再提交，立刻审自己刚写的那次改动。</p>

  <section class="panel">
    <div class="row">
      <div>
        <label for="repository">仓库路径</label>
        <input type="text" id="repository" spellcheck="false">
      </div>
      <div class="tight"><button class="ghost" id="reload">读取提交</button></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div>
        <label for="base">起始提交</label>
        <input type="text" id="base" spellcheck="false">
      </div>
      <div>
        <label for="head">结束提交</label>
        <input type="text" id="head" spellcheck="false">
      </div>
      <div class="tight">
        <label for="depth">审查深度</label>
        <select id="depth">
          <option value="FULL">完整（初审 + 取证 + 复核）</option>
          <option value="WITH_INVESTIGATION">不跑复核</option>
          <option value="TRIAGE_ONLY">只做初审</option>
        </select>
      </div>
      <div class="tight">
        <label for="sample">抽查比例（%）</label>
        <input type="number" id="sample" min="0" max="100" step="5" value="0">
      </div>
      <div class="tight"><button id="review">开始审查</button></div>
    </div>
    <div class="hint" id="modeHint">正在确认模型…</div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>提交历史（点「起点」「终点」挑选区间）</h2>
      <div class="commits" id="commits"><div class="empty">读取中…</div></div>
    </section>

    <section class="panel">
      <h2>改点代码，提交，然后审它</h2>
      <label for="fileSelect">文件</label>
      <select id="fileSelect"></select>
      <label for="content" style="margin-top:10px">内容</label>
      <textarea id="content" spellcheck="false"></textarea>
      <label for="message" style="margin-top:10px">提交说明</label>
      <input type="text" id="message" placeholder="例如：删掉空判，看看它说不说得出来">
      <div class="row" style="margin-top:10px">
        <div class="tight"><button id="commit">提交并审查</button></div>
        <div class="tight"><button class="ghost" id="revert">放弃修改</button></div>
      </div>
      <div class="hint">提交会写进工作区那份演示仓库，别指向你自己的项目。</div>
    </section>
  </div>

  <section id="result" style="display:none">
    <div class="cards" id="cards"></div>
    <section class="panel">
      <h2>分析单元</h2>
      <div id="units"></div>
    </section>
    <section class="panel">
      <h2>被筛除的文件（这里可以把它强行拉回审查）</h2>
      <div id="screened"></div>
    </section>

    <section class="panel">
      <h2>抽查（初审放行的单元随机复核）</h2>
      <div id="sampling"><div class="empty">未开启抽查。</div></div>

      <h2>评论</h2>
      <div id="comments"></div>
    </section>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const repo = () => $("repository").value.trim();
let currentFile = "";
let include = [];
let lastRun = null;

function api(path, options) {
  return fetch(path, options).then(async (response) => {
    const data = await response.json().catch(() => ({ error: "无法解析响应" }));
    if (!response.ok) { throw new Error(data.error || ("HTTP " + response.status)); }
    return data;
  });
}

function showError(message) {
  const box = $("units");
  $("result").style.display = "block";
  $("cards").innerHTML = "";
  box.innerHTML = `<div class="error">${message}</div>`;
  $("comments").innerHTML = "";
}

function samplingCaption(sampling) {
  if (!sampling || !sampling.rate) {
    return "未开启";
  }
  if (!sampling.sampled) {
    return "未抽中";
  }
  return `${sampling.sampled} 个 · ${Math.round(sampling.estimate * 100)}%`;
}

function tokenCaption(tokens) {
  if (!tokens || !tokens.calls) {
    return "0 次调用";
  }
  return `${tokens.calls} 次 · ${tokens.total} 令牌`;
}

function renderScreened(files) {
  if (include.length) {
    $("screened").innerHTML = `<div class="note" style="margin-bottom:8px">已强制纳入：${include.map(escapeHtml).join("、")}
      <button class="ghost" id="clearInclude" style="margin-left:8px">清除</button></div>`;
    $("clearInclude").onclick = () => { include = []; review(); };
    $("screened").insertAdjacentHTML("beforeend", screenedRows(files));
    bindIncludeButtons(files);
    return;
  }
  if (!files.length) {
    $("screened").innerHTML = '<div class="empty">没有被筛除的文件。</div>';
    return;
  }
  $("screened").innerHTML = screenedRows(files);
  bindIncludeButtons(files);
}

function screenedRows(files) {
  return files.map((file, index) => `
    <div class="row" style="align-items:flex-start; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)">
      <div>
        <code class="path">${escapeHtml(file.path)}</code>
        <div class="note">${escapeHtml(file.reason)}</div>
      </div>
      <div class="tight"><button class="ghost" data-include="${index}">强行纳入</button></div>
    </div>`).join("");
}

function bindIncludeButtons(files) {
  $("screened").querySelectorAll("[data-include]").forEach((button) => {
    button.onclick = () => {
      include = include.concat([files[Number(button.dataset.include)].path]);
      review();
    };
  });
}

function card(value, caption) {
  return `<div class="card"><div class="num">${value}</div><div class="cap">${caption}</div></div>`;
}

function loadMode() {
  api("/api/mode").then((data) => {
    $("modeHint").textContent = "模型：" + data.models + "。每次审查都会真的调用模型，会产生费用。";
  }).catch(() => { $("modeHint").textContent = "模型信息读取失败。"; });
}

function loadDefaults() {
  return api("/api/defaults").then((data) => {
    if (data.error) { return; }
    $("repository").value = data.repository;
    $("base").value = data.base;
    $("head").value = data.head;
  }).catch(() => {});
}

function loadCommits() {
  if (!repo()) { return Promise.resolve(); }
  return api("/api/commits?repository=" + encodeURIComponent(repo()))
    .then((data) => {
      const box = $("commits");
      if (!data.commits.length) { box.innerHTML = '<div class="empty">这个仓库还没有提交。</div>'; return; }
      box.innerHTML = data.commits.map((commit) => {
        const isBase = commit.id.startsWith($("base").value) || $("base").value === commit.id;
        const isHead = commit.id.startsWith($("head").value) || $("head").value === commit.id;
        const cls = isBase ? "base" : (isHead ? "head" : "");
        return `<div class="commit ${cls}">
          <span class="id">${commit.short}</span>
          <span class="msg" title="${escapeHtml(commit.message)}">${escapeHtml(commit.message)}</span>
          <button class="ghost pick" data-base="${commit.id}">起点</button>
          <button class="ghost pick" data-head="${commit.id}">终点</button>
        </div>`;
      }).join("");
      box.querySelectorAll("button[data-base]").forEach((button) => {
        button.onclick = () => { $("base").value = button.dataset.base; loadCommits(); };
      });
      box.querySelectorAll("button[data-head]").forEach((button) => {
        button.onclick = () => { $("head").value = button.dataset.head; loadCommits(); };
      });
    })
    .catch((error) => { $("commits").innerHTML = `<div class="error">${error.message}</div>`; });
}

function loadFiles() {
  if (!repo()) { return Promise.resolve(); }
  return api("/api/files?repository=" + encodeURIComponent(repo()))
    .then((data) => {
      const select = $("fileSelect");
      select.innerHTML = data.files.map((file) => `<option value="${file}">${file}</option>`).join("");
      if (data.files.length) { openFile(data.files[0]); }
    })
    .catch((error) => { $("content").value = ""; $("content").placeholder = error.message; });
}

function openFile(path) {
  currentFile = path;
  return api("/api/file?repository=" + encodeURIComponent(repo()) + "&path=" + encodeURIComponent(path))
    .then((data) => { $("content").value = data.content; })
    .catch((error) => { $("content").value = ""; showError(error.message); });
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function review() {
  if (!$("repository").value || !$("base").value || !$("head").value) {
    showError("仓库路径、起始提交、结束提交都要填。");
    return;
  }
  $("review").disabled = true;
  $("review").textContent = "审查中…";
  const payload = {
    repository: $("repository").value.trim(),
    base: $("base").value.trim(),
    head: $("head").value.trim(),
    depth: $("depth").value,
    sample: Number($("sample").value || 0),
    include: include
  };
  lastRun = payload;
  api("/api/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then((data) => {
    render(data);
  }).catch((error) => {
    showError(error.message);
  }).finally(() => {
    $("review").disabled = false;
    $("review").textContent = "开始审查";
  });
}

function render(data) {
  $("result").style.display = "block";
  $("cards").innerHTML = [
    card(data.unitCount, "单元"),
    card(data.commentCount, "评论"),
    card(data.assertions, "需修改"),
    card(data.questions, "待确认"),
    card(data.dropped, "被丢弃"),
    card(samplingCaption(data.sampling), "抽查"),
    card(tokenCaption(data.tokens), "模型消耗"),
    card(data.durationMs + " ms", "耗时")
  ].join("");

  renderScreened(data.screenedOut || []);
  renderSampling(data.sampling);

  if (!data.unitOutcomes.length) {
    $("units").innerHTML = '<div class="empty">该区间没有可审查的改动。</div>';
  } else {
    const rows = data.unitOutcomes.map((unit) => {
      const notes = (unit.abandoned || []).length
        ? `<div class="note">未下结论：${escapeHtml(unit.abandoned.join("；"))}</div>` : "";
      return `<tr>
        <td><code class="path">${escapeHtml(unit.file)}</code></td>
        <td>${escapeHtml(unit.unitKey)}</td>
        <td><span class="tier ${unit.tier}">${tierLabel(unit.tier)}</span></td>
        <td>${categoryLabel(unit.riskCategory)}</td>
        <td>${outcomeLabel(unit.outcome)}${notes}</td>
        <td>${unit.toolCalls}</td>
        <td>${unit.findings}${unit.sampled ? ' <span class="note">抽查</span>' : ""}</td>
      </tr>`;
    }).join("");
    $("units").innerHTML = `<table>
      <thead><tr><th>文件</th><th>单元</th><th>档位</th><th>风险类别</th><th>结局</th><th>工具调用</th><th>结论数</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  if (!data.comments.length) {
    $("comments").innerHTML = '<div class="empty">没有评论：没有单元被排期，或者结论都没通过证据校验。</div>';
  } else {
    $("comments").innerHTML = data.comments.map((comment) => `
      <article class="comment">
        <div class="where">${escapeHtml(comment.file)}:${comment.line} · ${categoryLabel(comment.riskCategory)}
          <span class="tag ${comment.status}">${comment.status === "ASSERTION" ? "需修改" : "待确认"}</span></div>
        <div class="body">${escapeHtml(comment.body)}</div>
        <div class="note">证据：${comment.evidence.length ? comment.evidence.join(", ") : "无（规则触发，未取得原文证据）"}</div>
      </article>`).join("");
  }
}

function renderSampling(sampling) {
  const box = $("sampling");
  if (!box) {
    return;
  }
  box.innerHTML = sampling && sampling.summary
    ? `<div class="note">${escapeHtml(sampling.summary)}</div>` : "";
}

const TIERS = { MUST_INVESTIGATE: "必查", JUDGE: "待判断", SKIP: "跳过" };
const CATEGORIES = { SECURITY: "安全", CONCURRENCY: "并发", RESOURCE: "资源", CONSISTENCY: "一致性", CONTRACT: "契约", LOGIC: "逻辑", DOCS: "文档" };
const OUTCOMES = {
  CONCLUDED: "出了结论", TOOL_BUDGET_EXHAUSTED: "工具预算用尽", TURN_BUDGET_EXHAUSTED: "回合用尽",
  MAX_FINDINGS_REACHED: "结论数到顶", STALLED: "无新信息", MODEL_FAILED: "模型调用失败"
};
const tierLabel = (value) => TIERS[value] || value;
const categoryLabel = (value) => CATEGORIES[value] || value;
const outcomeLabel = (value) => OUTCOMES[value] || value;

$("review").onclick = review;
$("reload").onclick = () => { loadCommits(); loadFiles(); };
$("fileSelect").onchange = (event) => openFile(event.target.value);
$("revert").onclick = () => { if (currentFile) { openFile(currentFile); } };
$("commit").onclick = () => {
  if (!currentFile) { showError("先选一个文件。"); return; }
  const message = $("message").value.trim() || ("Edit " + currentFile);
  const previousHead = $("head").value.trim();
  $("commit").disabled = true;
  api("/api/commit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ repository: repo(), path: currentFile, content: $("content").value, message })
  }).then((data) => {
    $("base").value = previousHead;
    $("head").value = data.commit;
    $("message").value = "";
    return loadCommits().then(review);
  }).catch((error) => {
    showError(error.message);
  }).finally(() => {
    $("commit").disabled = false;
  });
};

loadMode();
loadDefaults().then(() => { loadCommits(); loadFiles(); });
</script>
</body>
</html>
